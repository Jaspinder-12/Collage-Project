<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
        .container { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #28a745; }
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; transition: background-color 0.2s, box-shadow 0.2s; }
        a:hover { background: #0056b3; }
        a:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Predicted Sales: {{ prediction }}</h1>
        <a href="/">Go Back</a>
    </div>
</body>
</html>
