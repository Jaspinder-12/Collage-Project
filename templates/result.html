<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #111827;
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        p {
            color: #4b5563;
            margin-bottom: 1rem;
        }
        .result-box {
            background-color: #ecfdf5;
            border: 1px solid #d1fae5;
            border-radius: 0.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .result {
            font-size: 2.5rem;
            font-weight: 800;
            color: #059669;
            margin: 0;
        }
        .result-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #047857;
        }
        .back-btn {
            display: inline-block;
            background-color: white;
            color: #2563eb;
            border: 1px solid #d1d5db;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prediction Result 📊</h1>
        <div class="result-box">
            <span class="result-label">Estimated Sales</span>
            <div class="result">₹{{ prediction | round(2) }}</div>
        </div>
        <p>Based on the product details provided.</p>
        <a href="/" class="back-btn">← Predict Another Item</a>
    </div>
</body>
</html>
