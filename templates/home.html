<!DOCTYPE html>
<html>
<head>
    <title>BigMart Sales Prediction</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; background-color: #f4f4f9; }
        form { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5); border-color: #007bff; }
        button { background-color: #007bff; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%; transition: background-color 0.2s, opacity 0.2s, box-shadow 0.2s; }
        button:hover { background-color: #0056b3; }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5); }
        .required::after { content: "*"; color: red; margin-left: 4px; }
    </style>
</head>
<body>
    <form action="/predict" method="post">
        <h2>BigMart Sales Prediction</h2>

        <div class="form-group">
            <label for="item_weight" class="required">Item Weight</label>
            <input type="number" id="item_weight" name="item_weight" step="any" required>
        </div>

        <div class="form-group">
            <label for="item_fat_content" class="required">Item Fat Content (0=LF, 1=Low Fat, 2=Regular, 3=low fat, 4=reg)</label>
            <input type="number" id="item_fat_content" name="item_fat_content" step="any" required>
        </div>

        <div class="form-group">
            <label for="item_visibility" class="required">Item Visibility</label>
            <input type="number" id="item_visibility" name="item_visibility" step="any" required>
        </div>

        <div class="form-group">
            <label for="item_type" class="required">Item Type</label>
            <input type="number" id="item_type" name="item_type" step="any" required>
        </div>

        <div class="form-group">
            <label for="item_mrp" class="required">Item MRP</label>
            <input type="number" id="item_mrp" name="item_mrp" step="any" required>
        </div>

        <div class="form-group">
            <label for="outlet_establishment_year" class="required">Outlet Establishment Year</label>
            <input type="number" id="outlet_establishment_year" name="outlet_establishment_year" step="any" required>
        </div>

        <div class="form-group">
            <label for="outlet_size" class="required">Outlet Size (0=High, 1=Medium, 2=Small)</label>
            <input type="number" id="outlet_size" name="outlet_size" step="any" required>
        </div>

        <div class="form-group">
            <label for="outlet_location_type" class="required">Outlet Location Type (0=Tier 1, 1=Tier 2, 2=Tier 3)</label>
            <input type="number" id="outlet_location_type" name="outlet_location_type" step="any" required>
        </div>

        <div class="form-group">
            <label for="outlet_type" class="required">Outlet Type</label>
            <input type="number" id="outlet_type" name="outlet_type" step="any" required>
        </div>

        <button type="submit" id="submit-btn">Predict Sales</button>
    </form>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            var btn = document.getElementById('submit-btn');
            btn.innerHTML = 'Predicting...';
            btn.style.cursor = 'not-allowed';
            btn.style.opacity = '0.7';
        });
    </script>
</body>
</html>
