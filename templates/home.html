<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigMart Sales Prediction</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
            color: #111827;
            font-size: 1.875rem;
            font-weight: 700;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        @media (min-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }
        .form-group {
            margin-bottom: 0.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            color: #374151;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 0.875rem;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1.5rem;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .helper-text {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BigMart Sales Prediction 🛍️</h1>
        <form action="/predict" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label for="item_weight">Item Weight</label>
                    <input type="number" id="item_weight" name="item_weight" step="0.01" required placeholder="e.g. 9.30">
                </div>

                <div class="form-group">
                    <label for="item_fat_content">Item Fat Content</label>
                    <select id="item_fat_content" name="item_fat_content" required>
                        <option value="" disabled selected>Select content</option>
                        <option value="0">Low Fat</option>
                        <option value="1">Regular</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item_visibility">Item Visibility (0-1)</label>
                    <input type="number" id="item_visibility" name="item_visibility" step="0.0001" min="0" max="1" required placeholder="e.g. 0.016">
                </div>

                <div class="form-group">
                    <label for="item_type">Item Type</label>
                    <select id="item_type" name="item_type" required>
                        <option value="" disabled selected>Select type</option>
                        <option value="0">Baking Goods</option>
                        <option value="1">Breads</option>
                        <option value="2">Breakfast</option>
                        <option value="3">Canned</option>
                        <option value="4">Dairy</option>
                        <option value="5">Frozen Foods</option>
                        <option value="6">Fruits and Vegetables</option>
                        <option value="7">Hard Drinks</option>
                        <option value="8">Health and Hygiene</option>
                        <option value="9">Household</option>
                        <option value="10">Meat</option>
                        <option value="11">Others</option>
                        <option value="12">Seafood</option>
                        <option value="13">Snack Foods</option>
                        <option value="14">Soft Drinks</option>
                        <option value="15">Starchy Foods</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item_mrp">Item MRP (₹)</label>
                    <input type="number" id="item_mrp" name="item_mrp" step="0.01" required placeholder="e.g. 249.8">
                </div>

                <div class="form-group">
                    <label for="outlet_establishment_year">Establishment Year</label>
                    <input type="number" id="outlet_establishment_year" name="outlet_establishment_year" min="1985" max="2010" required placeholder="e.g. 1999">
                </div>

                <div class="form-group">
                    <label for="outlet_size">Outlet Size</label>
                    <select id="outlet_size" name="outlet_size" required>
                        <option value="" disabled selected>Select size</option>
                        <option value="0">High</option>
                        <option value="1">Medium</option>
                        <option value="2">Small</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="outlet_location_type">Location Type</label>
                    <select id="outlet_location_type" name="outlet_location_type" required>
                        <option value="" disabled selected>Select location</option>
                        <option value="0">Tier 1</option>
                        <option value="1">Tier 2</option>
                        <option value="2">Tier 3</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="outlet_type">Outlet Type</label>
                    <select id="outlet_type" name="outlet_type" required>
                        <option value="" disabled selected>Select outlet type</option>
                        <option value="0">Grocery Store</option>
                        <option value="1">Supermarket Type1</option>
                        <option value="2">Supermarket Type2</option>
                        <option value="3">Supermarket Type3</option>
                    </select>
                </div>
            </div>

            <button type="submit">Predict Sales 🚀</button>
        </form>
    </div>
</body>
</html>
