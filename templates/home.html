<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigMart Sales Prediction</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        label[for]::after { content: " *"; color: red; }
        input, select { width: 100%; padding: 0.5rem; margin-top: 0.5rem; box-sizing: border-box; outline: none; transition: box-shadow 0.2s; }
        input:focus, select:focus { box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25); border-color: #80bdff; }
        button {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: box-shadow 0.2s, background-color 0.2s;
        }
        button:focus-visible { box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5); }
        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .spinner {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button.loading .spinner {
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>BigMart Sales Prediction</h1>
    <form action="/predict" method="POST" id="predictForm">
        <label for="item_weight">Item Weight:</label>
        <input type="number" step="any" id="item_weight" name="item_weight" placeholder="e.g., 9.3" required>

        <label for="item_fat_content">Item Fat Content (0-4):</label>
        <input type="text" id="item_fat_content" name="item_fat_content" placeholder="e.g., 0 for Low Fat" required>

        <label for="item_visibility">Item Visibility:</label>
        <input type="number" step="any" id="item_visibility" name="item_visibility" placeholder="e.g., 0.016" required>

        <label for="item_type">Item Type (0-15):</label>
        <input type="text" id="item_type" name="item_type" placeholder="e.g., 4 for Dairy" required>

        <label for="item_mrp">Item MRP:</label>
        <input type="number" step="any" id="item_mrp" name="item_mrp" placeholder="e.g., 249.8" required>

        <label for="outlet_establishment_year">Outlet Establishment Year:</label>
        <input type="number" id="outlet_establishment_year" name="outlet_establishment_year" placeholder="e.g., 1999" required>

        <label for="outlet_size">Outlet Size (0-2):</label>
        <input type="text" id="outlet_size" name="outlet_size" placeholder="e.g., 1 for Medium" required>

        <label for="outlet_location_type">Outlet Location Type (0-2):</label>
        <input type="text" id="outlet_location_type" name="outlet_location_type" placeholder="e.g., 0 for Tier 1" required>

        <label for="outlet_type">Outlet Type (0-3):</label>
        <input type="text" id="outlet_type" name="outlet_type" placeholder="e.g., 1 for Supermarket" required>

        <button type="submit" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-text">Predict</span>
        </button>
    </form>

    <script>
        const form = document.getElementById('predictForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = submitBtn.querySelector('.btn-text');

        form.addEventListener('submit', function() {
            // Disable the button to prevent multiple submissions
            submitBtn.disabled = true;

            // Add loading class to show spinner
            submitBtn.classList.add('loading');

            // Change button text
            btnText.textContent = 'Predicting...';

            // Allow form submission to proceed
            return true;
        });
    </script>
</body>
</html>
