<!DOCTYPE html>
<html>
<head>
    <title>BigMart Sales Prediction</title>
</head>
<body>
    <h1>Predict Sales</h1>
    <form action="/predict" method="post">
        <label>Item Weight:</label> <input type="number" step="0.01" name="item_weight" value="10.5"><br>
        <label>Item Fat Content:</label> <input type="number" step="1" name="item_fat_content" value="1"><br>
        <label>Item Visibility:</label> <input type="number" step="0.01" name="item_visibility" value="0.05"><br>
        <label>Item Type:</label> <input type="number" step="1" name="item_type" value="4"><br>
        <label>Item MRP:</label> <input type="number" step="0.01" name="item_mrp" value="150.0"><br>
        <label>Outlet Establishment Year:</label> <input type="number" step="1" name="outlet_establishment_year" value="1999"><br>
        <label>Outlet Size:</label> <input type="number" step="1" name="outlet_size" value="1"><br>
        <label>Outlet Location Type:</label> <input type="number" step="1" name="outlet_location_type" value="1"><br>
        <label>Outlet Type:</label> <input type="number" step="1" name="outlet_type" value="1"><br>
        <input type="submit" value="Predict">
    </form>
</body>
</html>
