<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigMart Sales Prediction</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #1f2937;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #111827;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .hint {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sales Prediction</h1>
        <form action="/predict" method="post" onsubmit="const btn = this.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Predicting...'; btn.style.cursor = 'not-allowed'; btn.style.opacity = '0.7';">
            <div class="form-group">
                <label for="item_weight">Item Weight</label>
                <input type="number" step="0.01" id="item_weight" name="item_weight" required placeholder="e.g. 9.3">
            </div>

            <div class="form-group">
                <label for="item_fat_content">Item Fat Content</label>
                <select id="item_fat_content" name="item_fat_content" required>
                    <option value="" disabled selected>Select fat content</option>
                    <option value="1">Low Fat</option>
                    <option value="2">Regular</option>
                </select>
            </div>

            <div class="form-group">
                <label for="item_visibility">Item Visibility</label>
                <input type="number" step="0.0001" id="item_visibility" name="item_visibility" required placeholder="e.g. 0.016">
            </div>

            <div class="form-group">
                <label for="item_type">Item Type</label>
                <select id="item_type" name="item_type" required>
                    <option value="" disabled selected>Select item type</option>
                    <option value="0">Baking Goods</option>
                    <option value="1">Breads</option>
                    <option value="2">Breakfast</option>
                    <option value="3">Canned</option>
                    <option value="4">Dairy</option>
                    <option value="5">Frozen Foods</option>
                    <option value="6">Fruits and Vegetables</option>
                    <option value="7">Hard Drinks</option>
                    <option value="8">Health and Hygiene</option>
                    <option value="9">Household</option>
                    <option value="10">Meat</option>
                    <option value="11">Others</option>
                    <option value="12">Seafood</option>
                    <option value="13">Snack Foods</option>
                    <option value="14">Soft Drinks</option>
                    <option value="15">Starchy Foods</option>
                </select>
            </div>

            <div class="form-group">
                <label for="item_mrp">Item MRP</label>
                <input type="number" step="0.01" id="item_mrp" name="item_mrp" required placeholder="e.g. 249.80">
            </div>

            <div class="form-group">
                <label for="outlet_establishment_year">Outlet Establishment Year</label>
                <input type="number" id="outlet_establishment_year" name="outlet_establishment_year" required placeholder="e.g. 1999" min="1980" max="2025">
            </div>

            <div class="form-group">
                <label for="outlet_size">Outlet Size</label>
                <select id="outlet_size" name="outlet_size" required>
                    <option value="" disabled selected>Select outlet size</option>
                    <option value="0">High</option>
                    <option value="1">Medium</option>
                    <option value="2">Small</option>
                </select>
            </div>

            <div class="form-group">
                <label for="outlet_location_type">Outlet Location Type</label>
                <select id="outlet_location_type" name="outlet_location_type" required>
                    <option value="" disabled selected>Select location type</option>
                    <option value="0">Tier 1</option>
                    <option value="1">Tier 2</option>
                    <option value="2">Tier 3</option>
                </select>
            </div>

            <div class="form-group">
                <label for="outlet_type">Outlet Type</label>
                <select id="outlet_type" name="outlet_type" required>
                    <option value="" disabled selected>Select outlet type</option>
                    <option value="0">Grocery Store</option>
                    <option value="1">Supermarket Type1</option>
                    <option value="2">Supermarket Type2</option>
                    <option value="3">Supermarket Type3</option>
                </select>
            </div>

            <button type="submit">Predict Sales</button>
        </form>
    </div>
</body>
</html>
